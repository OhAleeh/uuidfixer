name: release

# Publishes a GitHub release for any pushed tag starting with "v".
# The displayed release name/version is taken from mod_version in
# gradle.properties (which may contain spaces, e.g. "2.0.1 - 26.3"),
# so tags must stay space-free (e.g. v2.0.1-26.3).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ vars.JAVA_VERSION || '25' }}
          distribution: 'microsoft'

      - name: extract version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: collect release artifact
        run: |
          mkdir -p release-artifacts
          cp build/libs/*.jar release-artifacts/
          rm -f release-artifacts/*-sources.jar

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/*.jar
