# Version pins for Minecraft, Loader, and Fabric API are auto-checked daily
# by .github/workflows/check-mc-update.yml and bumped via pull request.
#
# loom_version is NOT auto-updated. Loom's version scheme mixes stable and
# pre-release builds under the same metadata tag, and each Loom version can
# require a different Gradle version, so bumping it safely needs a human to
# actually run a build. Update it by hand along with the Gradle wrapper
# version in gradle/wrapper/gradle-wrapper.properties when needed. Check
# https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml
# for the current stable release.

minecraft_version=26.3
loader_version=0.20.1
fabric_api_version=0.165.0+26.3
loom_version=1.17.13
java_version=25

mod_version=26.3
maven_group=dev.komixkat
archives_base_name=uuidfixer

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
